apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgraph
  namespace: agentgraph
  labels:
    app.kubernetes.io/name: agentgraph
    app.kubernetes.io/managed-by: hath0r
    fargate: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentgraph
        fargate: "true"
    spec:
      serviceAccountName: agentgraph-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agentgraph
          image: 711387127111.dkr.ecr.us-east-1.amazonaws.com/agentgraph@sha256:9610adf5f7dab13887bac5f0bd9367fe2e38d60a04944e576b192ee348d143a9
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp-volume
          emptyDir: {}
