[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgraph"
version = "1.0.0"
description = "Multi-Plane Cognitive Substrate & Knowledge Graph Engine for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Ray Bayly", email = "ray@bayly.ai"}
]
keywords = ["ai-agents", "agent-graph", "knowledge-graph", "dag", "cognitive-substrate", "mcp", "bm25"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
agentgraph = "agentgraph.cli:main"
