name: AgentGraph Branch & PR Compliance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  branch_compliance_gate:
    name: Branch Protection & Reviewer Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Target Branch is Development
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          if [ "${{ github.base_ref }}" != "development" ]; then
            echo "ERROR: All Pull Requests must target the 'development' branch."
            echo "Direct merges into main, master, staging, or testing branches are forbidden."
            exit 1
          fi

      - name: Install AgentGraph
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Audit Repository Substrate Graph & Cycles
        run: |
          agentgraph validate --json
