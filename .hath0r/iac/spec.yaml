schema_version: "hath0r.iac.spec/1"
service_name: "agentgraph"
container:
  tech_stack: "python"
  base_image: "python:3.11-slim"
  multi_stage: true
  non_root_user:
    uid: 10001
    gid: 10001
    username: "hath0r"
  healthcheck:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 5
    retries: 3
  read_only_root_filesystem: true
salting:
  digest_pinning: true
  sha256_digest: "sha256:9610adf5f7dab13887bac5f0bd9367fe2e38d60a04944e576b192ee348d143a9"
  signature_provider: "cosign"
  attestation_format: "slsa-provenance-v1"
  secret_salting_provider: "aws_secrets_manager"
deployment:
  target_platform: "aws_eks_fargate"
  cluster_name: "hath0r-eks-cluster"
  namespace: "agentgraph"
  fargate_profile: "hath0r-agentgraph-profile"
  replicas: 2
  resources:
    cpu_request: "250m"
    cpu_limit: "500m"
    memory_request: "512Mi"
    memory_limit: "1Gi"
  ingress:
    alb_scheme: "internet-facing"
    target_type: "ip"
  irsa_iam_role_arn: "arn:aws:iam::711387127111:role/hath0r-agentgraph-irsa"
